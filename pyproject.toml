[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seformer"
version = "0.1.0"
description = "Cross-view spatio-temporal Transformer for facial-video engagement recognition"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
  {name = "Hessa Alfraihi"},
  {name = "Umar Raza Mukhtar"},
  {name = "Hamza Mukhtar"},
]
dependencies = [
  "torch>=2.2,<2.3",
  "torchvision>=0.17,<0.18",
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "opencv-python-headless>=4.8,<4.11",
  "matplotlib>=3.7,<4",
  "Pillow>=10.2,<10.3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
face = ["facenet-pytorch==2.6.0"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
